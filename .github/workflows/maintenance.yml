name: Maintenance
# Tâches ponctuelles sur la base Firestore (catalogue, carnet de prix…), avec le compte de service du déploiement.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche"
        required: true
        type: choice
        options: [seed, library, rebuild-pricebook, oneoff, images-setup, images-test, images, tri-prix, tri-prix-appliquer]
      count:
        description: "Nombre de photos (tâche images)"
        required: false
        default: "5"
permissions:
  contents: read
  id-token: write
env:
  WIF_PROVIDER: projects/187935869834/locations/global/workloadIdentityPools/github/providers/github
  WIF_SA: stoemp-ci@stoemp-app.iam.gserviceaccount.com
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix functions ci
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ env.WIF_PROVIDER }}", service_account: "${{ env.WIF_SA }}" }
      - name: Tâche
        run: |
          case "${{ inputs.task }}" in
            seed) npx tsx scripts/seed.ts ;;
            library) npx tsx scripts/seed.ts && npx tsx scripts/library/import.mts ;;
            rebuild-pricebook) npx tsx scripts/rebuild-pricebook.mts ;;
            oneoff) npx tsx scripts/maintenance/oneoff.mts ;;
            images-setup) npx tsx scripts/maintenance/images-setup.mts ;;
            images-test) TEST=1 npx tsx scripts/maintenance/images.mts ;;
            images) COUNT="${{ inputs.count }}" npx tsx scripts/maintenance/images.mts ;;
            tri-prix) npx tsx scripts/maintenance/tri-prix.mts ;;
            tri-prix-appliquer) APPLY=1 npx tsx scripts/maintenance/tri-prix.mts ;;
          esac
