name: Maintenance
# Tâches ponctuelles sur la base Firestore (catalogue, carnet de prix…), avec le compte de service du déploiement.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Tâche"
        required: true
        type: choice
        options: [seed, rebuild-pricebook, fix-library]
permissions:
  contents: read
  id-token: write
env:
  WIF_PROVIDER: projects/187935869834/locations/global/workloadIdentityPools/github/providers/github
  WIF_SA: stoemp-ci@stoemp-app.iam.gserviceaccount.com
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix functions ci
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ env.WIF_PROVIDER }}", service_account: "${{ env.WIF_SA }}" }
      - name: Tâche
        run: |
          case "${{ inputs.task }}" in
            seed) npx tsx scripts/seed.ts ;;
            rebuild-pricebook) npx tsx scripts/rebuild-pricebook.mts ;;
            fix-library) npx tsx scripts/maintenance/fix-library.mts ;;
          esac
