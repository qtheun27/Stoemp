name: Robot de prix (hebdomadaire)

on:
  schedule:
    - cron: "17 3 * * 0" # chaque dimanche, 3 h 17 UTC
  workflow_dispatch:
    inputs:
      stores: { description: "Enseignes (vide = toutes) : renmans colruyt delhaize carrefour ah", required: false, default: "" }

permissions:
  contents: read
  id-token: write

jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { working-directory: scraper } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/187935869834/locations/global/workloadIdentityPools/github/providers/github
          service_account: stoemp-ci@stoemp-app.iam.gserviceaccount.com
      # Un connecteur en panne ne fait jamais échouer le job : le rapport est dans les logs et dans Firestore (scraperRuns).
      - run: npm run prix -- ${{ github.event.inputs.stores }}
